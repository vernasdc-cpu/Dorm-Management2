

services:
  app:
    build: .
    container_name: heart-dorm-app
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
      - ./uploads:/var/www/html/uploads
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-heart_dorm_db}
      DB_USER: ${DB_USER:-heart_dorm}
      DB_PASS: ${DB_PASS:-change_me_strong_password}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-verna.sdc@gmail.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Heart Ladies Dormitory}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-verna.sdc@gmail.com}
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: heart-dorm-mail
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 5000
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: heart-dorm-db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root_change_me}
      MYSQL_DATABASE: ${DB_NAME:-heart_dorm_db}
      MYSQL_USER: ${DB_USER:-heart_dorm}
      MYSQL_PASSWORD: ${DB_PASS:-change_me_strong_password}
    volumes:
      - db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: heart-dorm-pma
    depends_on:
      - db
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    restart: unless-stopped

volumes:
  db_data:
