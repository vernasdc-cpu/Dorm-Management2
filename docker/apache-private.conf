<Directory "/var/www/html">
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
</Directory>

<LocationMatch "^/\.">
    Require all denied
</LocationMatch>

<DirectoryMatch "^/var/www/html/(config|database|docker|docs|includes|pages|scripts|secret|tests|vendor|uploads/billing)(/|$)">
    Require all denied
</DirectoryMatch>

<FilesMatch "^(Dockerfile|docker-compose\.ya?ml|production\.env\.example|composer\.(json|lock))$">
    Require all denied
</FilesMatch>
